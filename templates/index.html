<!DOCTYPE html>
<html lang="en" dir="ltr" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chitral EduCloud | Commercial Multi-School ERP</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#ecfdf5',
              100: '#d1fae5',
              200: '#a7f3d0',
              300: '#6ee7b7',
              400: '#34d399',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
              800: '#065f46',
              900: '#064e3b',
            },
            teal: {
              500: '#14b8a6',
              600: '#0d9488',
              700: '#0f766e',
            },
            brand: {
              dark: '#0f172a',
              card: '#ffffff',
              border: '#e2e8f0',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            urdu: ['"Noto Nastaliq Urdu"', '"Noto Sans Arabic"', 'serif'],
          }
        }
      }
    }
  </script>

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- QRCode.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="/static/css/style.css?v=6.0">
  <link rel="stylesheet" href="/static/css/custom.css?v=6.0">
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- TOP HEADER BAR, DESKTOP SIDEBAR & MOBILE BOTTOM NAV -->
  {% include 'partials/navbar_sidebar.html' %}

    <!-- MAIN SCROLLABLE CONTENT AREA -->
    <main id="mainContent" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8 pb-24 lg:pb-8">
      
      <!-- SCREEN 1 & 2: LOGIN & ADMIN DASHBOARD -->
      {% include 'partials/screen_auth_dashboard.html' %}

      <!-- SCREEN 3, 4 & 5: STUDENT SIS, 360 PROFILE & DIGITAL ID CARD -->
      {% include 'partials/screen_students.html' %}

      <!-- SCREEN 7, 8, 10 & 11: TEACHER WORKSPACE, ATTENDANCE, EXAMS & DMC -->
      {% include 'partials/screen_academics.html' %}

      <!-- SCREEN 6, 9, 12 & 13: PARENT PORTAL, FEES, WHATSAPP HUB & SETTINGS -->
      {% include 'partials/screen_finance_parent.html' %}

    </main>

  </div> <!-- End of .flex-1 .flex .overflow-hidden .relative opened in navbar_sidebar.html -->

  <!-- ==================== POPUP MODALS & TOAST NOTIFICATIONS ==================== -->
  {% include 'partials/modals.html' %}

  <!-- CORE DATA & INTERNATIONALIZATION SCRIPTS -->
  <script src="/static/js/translations.js?v=6.1"></script>
  <script src="/static/js/data.js?v=6.1"></script>
  <script src="/static/js/api.js?v=6.1"></script>
  <script src="/static/js/i18n.js?v=6.1"></script>

  <!-- MODULAR CONTROLLER MODULES -->
  <script src="/static/js/modules/state_router.js?v=6.1"></script>
  <script src="/static/js/modules/students_id.js?v=6.1"></script>
  <script src="/static/js/modules/academics_dmc.js?v=6.1"></script>
  <script src="/static/js/modules/finance_payroll.js?v=6.1"></script>
  <script src="/static/js/modules/charts_alerts.js?v=6.1"></script>

  <!-- MASTER INITIALIZER -->
  <script src="/static/js/app.js?v=6.1"></script>
</body>
</html>
